<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Physics Live Lab | Standing Waves</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172e4d;font:16px system-ui,sans-serif}main{display:grid;grid-template-columns:minmax(225px,27%) 1fr;gap:12px;padding:12px;min-height:100vh}aside,article{background:white;border:1px solid #dce5f0;border-radius:14px;padding:14px}h2{font-size:20px;margin:0 0 6px}p{margin:8px 0;line-height:1.35}label{display:block;font-size:14px;font-weight:650;margin-top:12px}input{width:100%;accent-color:#2563eb}output{float:right;color:#1d4ed8}button{border:1px solid #c9d8e9;background:#eff6ff;color:#17365d;border-radius:8px;padding:8px 10px;font-weight:650;cursor:pointer;margin:5px 3px 0 0}button:focus{outline:2px solid #2563eb}canvas{display:block;width:100%;height:clamp(220px,55vh,520px);background:#fcfdff;border-radius:8px}#stats{font-size:16px;font-weight:650;min-height:48px;padding:8px;background:#eef5ff;border-radius:8px}#legend{font-size:13px;color:#435b76}#task{border-left:3px solid #2563eb;padding-left:9px;font-size:14px}#table{font:13px system-ui;max-height:100px;overflow:auto} @media(max-width:600px){main{grid-template-columns:1fr}canvas{height:270px}}</style><style id="touch-controls-style">
html,body{overscroll-behavior:none}
#controls{touch-action:pan-y}
.touch-range-row{display:grid;grid-template-columns:42px minmax(0,1fr) 42px;align-items:center;gap:5px;margin:2px 0 4px}
.touch-range-row input[type=range]{width:100%;min-width:0;height:40px;margin:0;touch-action:none;user-select:none;-webkit-user-select:none;cursor:ew-resize}
.touch-range-row input[type=range]::-webkit-slider-thumb{width:26px;height:26px}
.touch-range-row button{min-width:42px;height:40px;margin:0;padding:0;font-size:24px;line-height:1;touch-action:none;user-select:none;-webkit-user-select:none}
button,select,input[type=checkbox]{touch-action:manipulation}
button:not(.touch-adjust){min-height:38px}
label:has(.touch-range-row){margin-top:7px}
@media (max-height:520px){.touch-range-row{grid-template-columns:36px minmax(0,1fr) 36px;gap:3px;margin:0}.touch-range-row button{min-width:36px;height:34px}.touch-range-row input[type=range]{height:34px}label:has(.touch-range-row){margin-top:4px}}
</style>
<main><aside><h2 id="heading"></h2><p id="task"></p><div id="controls"></div><button id="pause">Pause</button><button id="reset">Reset</button><button id="step">Step</button><div id="extra"></div><p id="legend"></p></aside><article><canvas id="cv" aria-label="Interactive standing wave diagram"></canvas><p id="stats"></p><div id="table"></div></article></main><script>
const mode=new URLSearchParams(location.search).get('mode')||'superposition';
const cfg={
superposition:['Superposition','Predict what happens when equal waves travelling in opposite directions overlap. Change reflected amplitude.',['harm','amp','reflect','rate']],
phase:['Nodes, antinodes & phase','Pause the wave. Compare particle A and B within one loop, then C across a node.',['phaseharm','rate']],
harmonics:['Harmonic frequencies','Tune the driving frequency until it matches a normal mode. Compare the number of loops and wavelength.',['length','speed','drive']],
tension:['String tension & mass','Predict the new wave speed and fundamental frequency when tension is quadrupled or mass per unit length changes.',['length','tension','mu','harm']],
sound:['Sound in a tube','Compare displacement nodes and pressure antinodes; move the detector along the closed tube.',['length','soundmode','probe','rate']],
practical:['Virtual string practical','Record several harmonics at fixed tension. Plot wavelength squared against reciprocal frequency squared and find the gradient.',['length','tension','mu','harm']]
};
const def={phaseharm:[2,6,2,1,'Harmonic n',''],harm:[1,6,2,1,'Harmonic n',''],amp:[0.2,1.5,1,.1,'Incident amplitude',''],reflect:[0,1,1,.05,'Reflected amplitude ratio',''],rate:[.2,2,.7,.1,'Animation speed','×'],length:[.3,2,1.2,.05,'Length L',' m'],speed:[40,240,120,5,'Wave speed v',' m/s'],drive:[10,700,100,5,'Driving frequency',' Hz'],tension:[5,100,25,1,'Tension T',' N'],mu:[1,20,5,.5,'Mass per length μ',' g/m'],soundmode:[1,5,1,1,'Closed–open mode',''],probe:[0,100,50,1,'Detector position','%']};
const conf=cfg[mode]||cfg.superposition,vals={},records=[]; const $=id=>document.getElementById(id);$('heading').textContent=conf[0];$('task').textContent=conf[1];
for(const k of conf[2]){let d=def[k];vals[k]=d[2];let el=document.createElement('label');el.innerHTML=d[4]+' <output id="o_'+k+'"></output><input id="i_'+k+'" type="range" min="'+d[0]+'" max="'+d[1]+'" step="'+d[3]+'" value="'+d[2]+'">';$('controls').appendChild(el);let upd=()=>{vals[k]=+$('i_'+k).value;$('o_'+k).textContent=vals[k]+d[5]};$('i_'+k).oninput=upd;upd()}
let t=0,paused=false,last=performance.now(),plot=false;const v=k=>vals[k]??def[k][2],canvas=$('cv'),ctx=canvas.getContext('2d');$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'Play':'Pause'};$('step').onclick=()=>{paused=true;$('pause').textContent='Play';t+=.2;draw()};$('reset').onclick=()=>{for(const k of conf[2]){$('i_'+k).value=def[k][2];$('i_'+k).oninput()}t=0;records.length=0;plot=false;table()};
function physics(){let L=v('length'),T=v('tension'),mu=v('mu')/1000,s=Math.sqrt(T/mu),n=mode==='phase'?v('phaseharm'):v('harm');if(mode==='harmonics'){s=v('speed');n=Math.max(1,Math.min(16,Math.round(v('drive')/(s/(2*L)))))}return{L,T,mu,s,n,f:n*s/(2*L),wl:2*L/n}}
function table(){if(mode!=='practical')return;$('table').innerHTML=records.map(r=>'n = '+r.n+' | f = '+r.f.toFixed(2)+' Hz | λ = '+r.wl.toFixed(3)+' m | λ² = '+(r.wl*r.wl).toFixed(4)+' m² | 1/f² = '+(1/r.f**2).toExponential(3)+' s²').join('<br>')}
if(mode==='practical'){for(const [txt,fn] of [['Record reading',()=>{records.push(physics());table()}],['Show graph',()=>{plot=!plot;draw()}],['Clear data',()=>{records.length=0;table()}]]){let b=document.createElement('button');b.textContent=txt;b.onclick=fn;$('extra').append(b)}}
$('legend').textContent=mode==='superposition'?'Blue: incident • orange: reflected • dark: resultant':mode==='sound'?'Blue: displacement amplitude • orange: pressure amplitude':mode==='phase'?'A and B are in phase; C is in antiphase. Red dots: nodes.':'Red: nodes • green: antinodes. Animation is slowed for visibility.';
function draw(){let W=canvas.clientWidth,H=canvas.clientHeight,dpr=Math.min(devicePixelRatio||1,2);if(canvas.width!==Math.round(W*dpr)||canvas.height!==Math.round(H*dpr)){canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr)}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);const x0=44,x1=W-24,w=x1-x0,cy=H*.52,A=H*.27;ctx.font='14px system-ui';ctx.lineWidth=1;function text(s,x,y,c='#253d57'){ctx.fillStyle=c;ctx.fillText(s,x,y)}function line(xa,ya,xb,yb,c='#a5b5c7'){ctx.strokeStyle=c;ctx.beginPath();ctx.moveTo(xa,ya);ctx.lineTo(xb,yb);ctx.stroke()}function curve(fn,y,a,c,lw=2){ctx.strokeStyle=c;ctx.lineWidth=lw;ctx.beginPath();for(let i=0;i<=300;i++){let u=i/300,xx=x0+u*w,yy=y-a*fn(u);i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy)}ctx.stroke()}function dot(u,y,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x0+u*w,y,5,0,2*Math.PI);ctx.fill()}const p=physics(),{L,T,mu,s,n,f,wl}=p;const phase=t*2*Math.PI*.5;
if(mode==='practical'&&plot){let px=x0,py=H-36,pw=w-16,ph=H-68;line(px,py,px+pw,py);line(px,py,px,py-ph);let maxX=Math.max(1e-8,...records.map(r=>1/r.f**2))*1.13,maxY=Math.max(1e-8,...records.map(r=>r.wl**2))*1.13;text('λ² (m²)',px,18);text('1/f² (s²)',px+pw-85,H-9);for(let i=0;i<=4;i++){let u=i/4;line(px+u*pw,py,px+u*pw,py-ph,'#e6edf4');line(px,py-u*ph,px+pw,py-u*ph,'#e6edf4');text((u*maxY).toPrecision(2),2,py-u*ph+4);text((u*maxX).toExponential(1),px+u*pw-12,py+17)}for(const r of records){ctx.fillStyle='#2563eb';ctx.beginPath();ctx.arc(px+(1/r.f**2)/maxX*pw,py-r.wl**2/maxY*ph,5,0,7);ctx.fill()}let same=records.length>1&&records.every(r=>Math.abs(r.s-records[0].s)<1e-8);if(same){let k=records[0].s**2,x=Math.min(maxX,maxY/k);line(px,py,px+x/maxX*pw,py-k*x/maxY*ph,'#1d4ed8')} $('stats').textContent=same?'Gradient = T/μ = '+(records[0].s**2).toFixed(0)+' m² s⁻². Use μ = T / gradient.':'Record at least two harmonics at constant tension and μ.';return}
if(mode==='superposition'){let k=n*Math.PI,r=v('reflect'),a=v('amp'),g=u=>a*Math.sin(k*u-phase),j=u=>a*r*Math.sin(k*u+phase);let rows=[H*.19,H*.48,H*.78],scale=H*.085;for(let y of rows)line(x0,y,x1,y);curve(g,rows[0],scale,'#2563eb');curve(j,rows[1],scale,'#ea8b23');curve(u=>g(u)+j(u),rows[2],scale,'#172e4d',3);text('Incident →',5,rows[0]-scale-6);text('Reflected ←',5,rows[1]-scale-6);text('Resultant',5,rows[2]-2*scale-5);if(r===1)for(let j=0;j<=n;j++)dot(j/n,rows[2],'#dc2626');$('stats').textContent=r===1?'Equal amplitudes: permanent nodes, antinodes; no net energy transfer.':'Unequal amplitudes: partial standing wave; minima no longer have zero amplitude.';return}
if(mode==='sound'){let odd=2*v('soundmode')-1,k=odd*Math.PI/2,ff=343*odd/(4*L),u=v('probe')/100;line(x0,cy,x1,cy);line(x0,cy-A-10,x0,cy+A+10,'#172e4d');curve(x=>Math.sin(k*x),cy,A,'#2563eb');curve(x=>-Math.sin(k*x),cy,A,'#2563eb');curve(x=>Math.cos(k*x),cy,A,'#ea8b23');curve(x=>-Math.cos(k*x),cy,A,'#ea8b23');line(x0+u*w,cy-A-15,x0+u*w,cy+A+15,'#222');text('Closed end',x0,22);text('Open end',x1-75,22);$('stats').textContent='f = '+ff.toFixed(1)+' Hz • λ = '+(4*L/odd).toFixed(2)+' m • relative displacement amplitude '+Math.abs(Math.sin(k*u)).toFixed(2)+' • pressure amplitude '+Math.abs(Math.cos(k*u)).toFixed(2);return}
line(x0,cy,x1,cy);line(x0,cy-A,x0,cy+A,'#172e4d');line(x1,cy-A,x1,cy+A,'#172e4d');
let det=Math.abs(v('drive')-f)/(s/(2*L));let gain=mode==='harmonics'?1/Math.sqrt(1+(det/.09)**2):1;
curve(u=>Math.sin(n*Math.PI*u),cy,A*gain,'#a7c5ec',1.3);curve(u=>-Math.sin(n*Math.PI*u),cy,A*gain,'#a7c5ec',1.3);curve(u=>Math.sin(n*Math.PI*u)*Math.cos(phase),cy,A*gain,'#1d4ed8',3);
for(let j=0;j<=n;j++)dot(j/n,cy,'#dc2626');for(let j=0;j<n;j++)dot((j+.5)/n,cy-A*gain*Math.sin(n*Math.PI*(j+.5)/n)*Math.cos(phase),'#16a34a');
if(mode==='phase'){let positions=[.25/n,.65/n,Math.min(1.25/n,.99)];positions.forEach((u,i)=>{let y=cy-A*Math.sin(n*Math.PI*u)*Math.cos(phase);dot(u,y,'#8338bc');text('ABC'[i],x0+u*w+7,y-8,'#8338bc')});}
text('Fixed end',x0,22);text('Fixed end',x1-65,22);$('stats').textContent=mode==='harmonics'?'Drive '+v('drive')+' Hz • nearest mode n = '+n+' at '+f.toFixed(1)+' Hz • '+(det<.06?'near resonance':'off resonance (weak response)')+' • λ = '+wl.toFixed(2)+' m (ideal mode)':'n = '+n+' • λ = '+wl.toFixed(3)+' m • v = '+s.toFixed(1)+' m/s • f = '+f.toFixed(1)+' Hz';
}
function frame(now){let dt=Math.min(.05,(now-last)/1000);last=now;if(!paused)t+=dt*v('rate');draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script><script id="touch-controls-script">
(function(){
'use strict';
const controls=document.getElementById('controls');
if(!controls)return;
function setAt(el,x){
 const r=el.getBoundingClientRect(), min=Number(el.min||0),max=Number(el.max||100),step=Number(el.step)||1;
 const frac=Math.max(0,Math.min(1,(x-r.left-13)/Math.max(1,r.width-26)));
 const val=Math.max(min,Math.min(max,min+Math.round((max-min)*frac/step)*step));
 el.value=String(Number(val.toFixed(8)));
 el.dispatchEvent(new Event('input',{bubbles:true}));
}
function adjust(el,d){
 const old=el.value;
 if(d>0)el.stepUp();else el.stepDown();
 if(el.value!==old){el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}));}
}
function wire(el){
 if(el.dataset.touchReady)return;
 el.dataset.touchReady='1';
 const row=document.createElement('div');row.className='touch-range-row';
 // A label may contain the range; keep the new buttons outside the label to avoid label activation.
 const parent=el.parentElement;
 if(parent.tagName==='LABEL')parent.after(row);else el.before(row);
 const make=(d)=>{const b=document.createElement('button');b.type='button';b.className='touch-adjust';b.textContent=d>0?'+':'−';b.setAttribute('aria-label',(d>0?'Increase ':'Decrease ')+(el.getAttribute('aria-label')||el.id));b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();adjust(el,d)});return b};
 row.append(make(-1),el,make(1));
 let active=null;
 el.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse')return;
  e.preventDefault();e.stopPropagation();active=e.pointerId;
  try{el.setPointerCapture(e.pointerId)}catch(_){}
  setAt(el,e.clientX);
 },{passive:false});
 el.addEventListener('pointermove',e=>{if(active!==e.pointerId)return;e.preventDefault();e.stopPropagation();setAt(el,e.clientX)},{passive:false});
 function end(e){if(active!==e.pointerId)return;e.preventDefault();e.stopPropagation();active=null;el.dispatchEvent(new Event('change',{bubbles:true}));}
 el.addEventListener('pointerup',end,{passive:false});el.addEventListener('pointercancel',end,{passive:false});
 el.addEventListener('lostpointercapture',()=>{active=null});
 // Older webviews without Pointer Events.
 if(!window.PointerEvent){
  const update=e=>{if(!e.touches.length)return;e.preventDefault();e.stopPropagation();setAt(el,e.touches[0].clientX)};
  el.addEventListener('touchstart',update,{passive:false});el.addEventListener('touchmove',update,{passive:false});
 }
}
function scan(){controls.querySelectorAll('input[type=range]').forEach(wire)}
scan();new MutationObserver(scan).observe(controls,{childList:true,subtree:true});
})();
</script></html>
