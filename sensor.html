<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Physics Live Lab</title><style>
*{box-sizing:border-box}body{margin:0;font:16px Arial,sans-serif;color:#17365d;background:white;padding:12px}#app{height:calc(100vh - 24px);display:flex;flex-direction:column;gap:8px}header{display:flex;align-items:center;gap:12px}h1{margin:0;font-size:clamp(16px,2.6vw,28px);flex:1}.brand{font-size:12px;letter-spacing:1px;font-weight:bold}button,select{background:#eaf2f8;border:1px solid #a9c1d7;border-radius:6px;color:#17365d;padding:8px;cursor:pointer;font-weight:bold}#q{margin:0;font-size:clamp(12px,1.65vw,19px);font-weight:bold}.main{display:grid;grid-template-columns:1.35fr 1fr;gap:12px;min-height:0;flex:1}.left{display:flex;flex-direction:column;min-height:0;background:#f8fafc;border:1px solid #d1deea;border-radius:9px;overflow:hidden}.left svg{width:100%;height:100%;min-height:0;flex:1}.right{display:flex;flex-direction:column;gap:6px;overflow:auto}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:6px}.metric{background:#eaf2f8;border-radius:7px;padding:7px}.metric span{font-size:clamp(10px,1.2vw,14px)}.metric strong{display:block;font-size:clamp(16px,2.7vw,29px);margin-top:3px}.metric:nth-child(even) strong{color:#b45309}.control{padding:2px 0}.control label{display:flex;justify-content:space-between;font-size:clamp(12px,1.4vw,16px);font-weight:bold}input[type=range]{width:100%;accent-color:#1f4e79;margin:6px 0;cursor:pointer}#formula,#note{margin:0;padding:7px 9px;border-radius:6px;background:#fff3db;font-size:clamp(11px,1.4vw,16px)}#note{background:#eaf2f8}.bar{display:flex;height:25px;margin:5px 10px 10px;overflow:hidden;border-radius:5px;flex-shrink:0}.bar span{display:flex;align-items:center;justify-content:center;color:white;overflow:hidden;white-space:nowrap;font-size:12px;font-weight:bold}svg text{font:16px Arial,sans-serif;fill:#17365d}svg .val{font-weight:bold;font-size:20px}svg .out{fill:#b45309;font-weight:bold}svg .cur{fill:#137a53;font-weight:bold}svg .wire{fill:none;stroke:#17365d;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.foot{font-size:11px;color:#65778a}#hit{cursor:ew-resize;touch-action:none}
</style><div id="app"><header><span class="brand">PHYSICS LIVE LAB</span><h1 id="title"></h1><button id="hide">Hide readings</button><button id="reset">Reset</button></header><p id="q"></p><div class="main"><div class="left"><svg id="svg" viewBox="0 0 620 340" aria-label="Circuit simulation"></svg><div id="bar" class="bar"></div></div><div class="right"><div class="metrics" id="metrics"></div><div id="controls"></div><div id="formula"></div><p id="note"></p></div></div><div class="foot">Ideal DC supply • live calculations • drag the sliders or the potentiometer contact.</div></div><script>
"use strict";
const modes={ohm:['Resistance and current','What changes when resistance increases?',{v:12,r:6}],ratio:['Voltage distribution','Which resistor receives the greatest share of the voltage?',{v:10,a:20,b:30,c:50}],divider:['Potential divider','Increase R₂: can current fall while output voltage rises?',{v:12,a:10,b:10}],sensor:['LDR and street lighting','Change light intensity and observe the separate lamp switch.',{v:12,a:10,light:85,pos:'bottom'}],pot:['Potentiometer','Drag the contact along the uniform 100 mm track.',{v:8,p:50}],load:['Loaded potential divider','Connect a load and observe the effect on output voltage.',{v:12,a:50,b:10,r:10,connected:false}]};
const mode='sensor',cfg=modes[mode]||modes.divider,$=x=>document.getElementById(x),f=(n,d=2)=>Number(n.toFixed(d)).toString();let s={...cfg[2]},hide=false;
$('title').textContent=cfg[0];$('q').textContent=cfg[1];
function range(k,l,min,max,step,u){return '<div class="control"><label for="'+k+'">'+l+'<output id="val-'+k+'"></output></label><input id="'+k+'" data-unit="'+u+'" type="range" min="'+min+'" max="'+max+'" step="'+step+'" value="'+s[k]+'"></div>'}
function controls(){let h=range('v','Supply voltage',1,24,.1,'V');if(mode==='ohm')h+=range('r','Resistance',1,100,.1,'Ω');if(['ratio','divider','load'].includes(mode))h+=range('a','R₁',1,100,1,'Ω')+range('b','R₂',1,100,1,'Ω');if(mode==='ratio')h+=range('c','R₃',1,100,1,'Ω');if(mode==='sensor')h+=range('a','Fixed resistance',1,100,1,'kΩ')+range('light','Light intensity',0,100,1,'%')+'<label>LDR position <select id="pos"><option value="bottom">Output resistor</option><option value="top">First resistor</option></select></label>';if(mode==='pot')h+=range('p','Contact from A',0,100,.1,'mm');if(mode==='load')h+='<label><input id="connected" type="checkbox"> Connect load</label>'+range('r','Load resistance',1,200,1,'Ω');$('controls').innerHTML=h;Object.keys(s).forEach(k=>{let el=$(k);if(!el)return;if(el.type==='checkbox')el.checked=s[k];else el.value=s[k];el.oninput=()=>{s[k]=el.type==='checkbox'?el.checked:el.tagName==='SELECT'?el.value:+el.value;render()}})}
function path(d){return '<path class="wire" d="'+d+'"/>'}function line(a,b,c,d){return path('M'+a+' '+b+' L'+c+' '+d)}function tx(x,y,t,cls='',anchor='middle'){return '<text x="'+x+'" y="'+y+'" class="'+cls+'" text-anchor="'+anchor+'">'+t+'</text>'}function dot(x,y){return '<circle cx="'+x+'" cy="'+y+'" r="4" fill="#17365d"/>'}function res(x,y,w,label,v,out){return '<rect x="'+x+'" y="'+(y-21)+'" width="'+w+'" height="42" rx="2" fill="'+(out?'#fff3db':'#eaf2f8')+'" stroke="'+(out?'#b45309':'#1f4e79')+'" stroke-width="2"/>'+tx(x+w/2,y+6,label,'val')+tx(x+w/2,y-32,hide?'? V':f(v)+' V',out?'out':'val')}
function meter(x,y){return '<circle cx="'+x+'" cy="'+y+'" r="20" fill="white" stroke="#17365d" stroke-width="2"/>'+tx(x,y+6,'V','val')}
function circuit(labels,vs,I,u,opts={}){let x0=98,xe=570,y=105,yb=265,w=100,step=(xe-x0)/(labels.length+1),prev=x0,last=0;let h=path('M98 105 V175 M79 175 H117 M87 193 H109 M98 193 V265 H570 V105')+tx(68,190,f(s.v)+' V','val','end');labels.forEach((l,j)=>{let xc=x0+step*(j+1),a=xc-w/2;h+=line(prev,y,a,y)+res(a,y,w,l,vs[j],j===labels.length-1&&labels.length>1);prev=a+w;last=xc});h+=line(prev,y,xe,y);if(opts.meter){let a=last-w/2,b=last+w/2;h+=path('M'+a+' 105 V185 H'+(last-20))+meter(last,185)+path('M'+(last+20)+' 185 H'+b+' V105')+dot(a,105)+dot(b,105)}if(opts.load){let a=last-w/2,b=last+w/2;h+=path('M'+a+' 105 V185 H'+(last-42))+res(last-42,185,84,f(s.r)+' Ω',vs[1],true)+path('M'+(last+42)+' 185 H'+b+' V105')+dot(a,105)+dot(b,105)}if(opts.ldr!==undefined){let xc=x0+step*(opts.ldr+1);h+='<path d="M'+(xc-29)+' 20 l20 25 m-10 -3 l10 3 l-2 -10 M'+(xc+3)+' 20 l20 25 m-10 -3 l10 3 l-2 -10" stroke="#b45309" fill="none" stroke-width="2"/>'}h+=tx(310,294,hide?'I = ?':(opts.load?'Supply current = ':'I = ')+f(I,3)+' '+u,'cur');let dur=Math.max(.8,Math.min(9,1.7/(I+.08)));for(let j=0;j<5;j++)h+='<circle r="4" fill="#137a53"><animateMotion dur="'+dur+'s" begin="-'+(j*dur/5)+'s" repeatCount="indefinite" path="M550 265 H110"/></circle>';return h}
function metric(l,v){return '<div class="metric"><span>'+l+'</span><strong>'+(hide?'?':v)+'</strong></div>'}
function render(){Object.keys(s).forEach(k=>{if($('val-'+k))$('val-'+k).textContent=f(s[k],1)+' '+$(k).dataset.unit});let h='',m='',fo='',nt='',vs=[],i,o;
if(mode==='ohm'){i=s.v/s.r;vs=[s.v];h=circuit([f(s.r)+' Ω'],vs,i,'A');m=metric('Voltage',f(s.v)+' V')+metric('Current',f(i,3)+' A');fo='I = V / R = '+f(s.v)+' / '+f(s.r)+' = '+f(i,3)+' A';nt='An ideal supply keeps its voltage constant; increasing resistance reduces current.'}
if(mode==='ratio'){let t=s.a+s.b+s.c;i=s.v/t;vs=[s.a*i,s.b*i,s.c*i];h=circuit([s.a+' Ω',s.b+' Ω',s.c+' Ω'],vs,i,'A');m=metric('Total resistance',t+' Ω')+metric('Current',f(i,3)+' A');fo='V₁ : V₂ : V₃ = R₁ : R₂ : R₃';nt='Same current through each resistor: the larger resistance transfers more energy per coulomb.'}
if(mode==='divider'){i=s.v/(s.a+s.b);o=i*s.b;vs=[i*s.a,o];h=circuit([s.a+' Ω',s.b+' Ω'],vs,i,'A',{meter:true});m=metric('Circuit current',f(i,3)+' A')+metric('Output p.d.',f(o)+' V');fo='Vout = '+f(s.v)+' × '+s.b+' / '+(s.a+s.b)+' = '+f(o)+' V';nt='Increasing R₂ raises its share of the supply voltage even though the current decreases.'}
if(mode==='sensor'){let lr=Math.pow(10,2-2*s.light/100),a=s.pos==='bottom'?s.a:lr,b=s.pos==='bottom'?lr:s.a;i=s.v/(a+b);o=i*b;vs=[i*a,o];let on=o>=6;h=circuit([f(a)+' kΩ',f(b)+' kΩ'],vs,i,'mA',{meter:true,ldr:s.pos==='bottom'?1:0})+'<circle cx="490" cy="315" r="20" fill="'+(on?'#facc15':'#a6b3c1')+'" stroke="#17365d" stroke-width="2"/><path d="M477 302 l26 26 m0 -26 l-26 26" stroke="#17365d" stroke-width="2"/>'+tx(455,320,on?'ON':'OFF','out','end');m=metric('Sensor current',f(i,3)+' mA')+metric('Control p.d.',f(o)+' V')+metric('LDR resistance',f(lr)+' kΩ')+metric('Separate lamp',on?'ON':'OFF');fo='Illustrative switch threshold = 6 V';nt='The LDR resistance is high in darkness. Output voltage controls a separate lamp circuit, not the sensor current.'}
if(mode==='pot'){let x=105+445*s.p/100;o=s.v*s.p/100;vs=[o,s.v-o];h=path('M105 100 V260 H309 M329 260 H550 V100')+line(309,248,309,272)+line(329,238,329,282)+tx(319,300,f(s.v)+' V','val')+'<rect x="105" y="83" width="445" height="34" fill="#eaf2f8" stroke="#1f4e79" stroke-width="2"/><rect x="106" y="84" width="'+443*s.p/100+'" height="32" fill="#f6c78c"/>'+tx(105,65,'A: 0 V','val')+tx(550,65,'B: '+f(s.v)+' V','val')+'<path d="M'+x+' 122 l-10 19 h20 z" fill="#b45309"/>'+path('M'+x+' 141 V160 H195 V185')+meter(195,205)+path('M195 225 V240 H105')+dot(105,240)+tx(350,205,'Drag the contact','out')+'<rect id="hit" x="95" y="77" width="465" height="85" fill="transparent"/>';m=metric('Position',f(s.p,1)+' mm')+metric('Voltmeter',f(o)+' V');fo='Vout = '+f(s.v)+' × '+f(s.p,1)+' / 100 = '+f(o)+' V';nt='For a uniform track and ideal voltmeter, p.d. is proportional to length.'}
if(mode==='load'){let rp=s.connected?s.b*s.r/(s.b+s.r):s.b;i=s.v/(s.a+rp);o=i*rp;vs=[s.a*i,o];h=circuit([s.a+' Ω',s.b+' Ω'],vs,i,'A',{load:s.connected});m=metric('Equivalent output R',f(rp)+' Ω')+metric('Output p.d.',f(o)+' V')+metric('Supply current',f(i,3)+' A')+metric('Unloaded p.d.',f(s.v*s.b/(s.a+s.b))+' V');fo='Equivalent output resistance = '+f(rp)+' Ω';nt='A finite parallel load lowers the effective output resistance and output voltage. Current divides at the junction.'}
$('svg').innerHTML=h;$('metrics').innerHTML=m;$('formula').textContent=hide?'Predict before revealing the readings.':fo;$('note').textContent=hide?'Explain your prediction using Ohm’s law.':nt;$('bar').innerHTML=vs.map((v,j)=>'<span style="width:'+v/s.v*100+'%;background:'+['#1f4e79','#137a53','#b45309'][j===vs.length-1?2:j]+'">'+(hide?'?':f(v)+' V')+'</span>').join('');if($('hit'))$('hit').onpointerdown=e=>{e.preventDefault();drag=true;move(e)}}
let drag=false;function move(e){const svg=$('svg'),p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(svg.getScreenCTM().inverse());s.p=Math.max(0,Math.min(100,Math.round((q.x-105)/445*1000)/10));$('p').value=s.p;render()}document.onpointermove=e=>{if(drag){e.preventDefault();move(e)}};document.onpointerup=document.onpointercancel=()=>drag=false;
$('reset').onclick=()=>{s={...cfg[2]};hide=false;$('hide').textContent='Hide readings';controls();render()};$('hide').onclick=()=>{hide=!hide;$('hide').textContent=hide?'Reveal readings':'Hide readings';render()};controls();render();
</script></html>
